[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devsquad"
version = "0.2.0"
description = "Local-first autonomous AI engineering studio and multi-agent development team for real-world codebases."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sanjaydeep Gowrishankar", email = "30902986+sanjaydep1996@users.noreply.github.com" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0"
]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest>=7.0.0"
]
all = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest>=7.0.0"
]

[project.scripts]
devsquad = "devsquad.cli:main"

[project.urls]
Homepage = "https://github.com/sanjaydep1996/devsquad"
Issues = "https://github.com/sanjaydep1996/devsquad/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
