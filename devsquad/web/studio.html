<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevSquad · Autonomous AI Engineering Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1122'/%3E%3Cpath fill='%2338BDF8' d='M8 24V8l8 5-8 5zM16 24V8l8 5-8 5z'/%3E%3C/svg%3E">
  <script>(function(){var t;try{t=localStorage.getItem('devsquad-theme')}catch(e){}document.documentElement.setAttribute('data-theme',t||'dark')})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
      --f-ui: "Instrument Sans", system-ui, sans-serif;
      --f-mono: "JetBrains Mono", monospace;
      --f-pixel: "Press Start 2P", monospace;

      --bg: #090D1A;
      --bg2: #131A33;
      --solid: #10162A;
      --ink: #E8ECF6;
      --dim: #94A0BC;
      --line: #252F4D;
      --line2: #38456B;
      --lot: rgba(255, 255, 255, 0.05);
      --lot2: rgba(255, 255, 255, 0.08);

      --accent: #38BDF8;
      --accent-ink: #04131D;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --accent-glow: rgba(56, 189, 248, 0.35);

      --ok: #34D399;
      --ok-bg: rgba(52, 211, 153, 0.15);
      --warn: #FBBF24;
      --warn-bg: rgba(251, 191, 36, 0.15);
      --bad: #F87171;
      --bad-bg: rgba(248, 113, 113, 0.15);

      --header-h: 56px;
      --chat-w: 380px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f-ui);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header {
      height: var(--header-h);
      background: var(--solid);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      flex: none;
      z-index: 50;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -.02em;
    }
    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0284C7, #38BDF8);
      display: grid;
      place-items: center;
      font-size: 15px;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .tag-pill {
      font-family: var(--f-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .repo-pill {
      font-family: var(--f-mono);
      font-size: 12px;
      color: var(--dim);
      background: var(--lot);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-review-desk {
      background: var(--accent);
      color: var(--accent-ink);
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 12.5px;
      padding: 7px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: filter .15s ease, transform .1s ease;
    }
    .btn-review-desk:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--ok);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--ok);
      display: inline-block;
    }

    /* Main Grid Viewport */
    .viewport-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Pixel Canvas Area */
    .canvas-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #060913;
    }
    .canvas-frame {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 10px;
    }
    #officeCanvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .8), 0 0 0 1px var(--line);
      max-width: 100%;
      max-height: 100%;
    }

    /* Quick Dispatch Command Bar at Bottom */
    .bottom-command-bar {
      height: 64px;
      background: var(--solid);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 20;
    }
    .input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .prompt-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line2);
      border-radius: 10px;
      padding: 10px 14px;
      padding-right: 110px;
      color: var(--ink);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .prompt-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .btn-run-relay {
      position: absolute;
      right: 6px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 7px;
      padding: 7px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .quick-chips-row {
      display: flex;
      gap: 8px;
    }
    .quick-chip {
      background: var(--lot);
      border: 1px solid var(--line);
      color: var(--dim);
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s ease;
    }
    .quick-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* Right Side Agent Activity / Feed */
    .feed-panel {
      width: var(--chat-w);
      background: var(--solid);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex: none;
    }
    .feed-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .feed-header h3 {
      font-family: var(--f-display);
      font-size: 14px;
      font-weight: 700;
    }
    .feed-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-family: var(--f-mono);
      font-size: 11.5px;
    }
    .feed-item {
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--lot);
      border: 1px solid var(--line);
      line-height: 1.5;
    }
    .feed-agent-tag {
      font-weight: 700;
      display: inline-block;
      margin-bottom: 4px;
    }
    .tag-apex { color: #818CF8; }
    .tag-alpha { color: #38BDF8; }
    .tag-gamma { color: #34D399; }
    .tag-delta { color: #FBBF24; }
    .tag-system { color: var(--dim); }

    /* The Review Desk Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 16, 0.75);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .review-modal {
      width: 880px;
      max-width: 95vw;
      max-height: 90vh;
      background: var(--solid);
      border: 1px solid var(--line2);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--accent-glow);
      overflow: hidden;
    }
    .modal-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-head h2 {
      font-family: var(--f-display);
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal-body {
      padding: 20px 22px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .diff-block {
      background: #060913;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font-family: var(--f-mono);
      font-size: 11px;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .diff-add { color: var(--ok); background: rgba(52, 211, 153, 0.08); display: block; }
    .diff-del { color: var(--bad); background: rgba(248, 113, 113, 0.08); display: block; }
    .modal-foot {
      padding: 14px 22px;
      border-top: 1px solid var(--line);
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-apply-direct {
      background: var(--ok);
      color: #04140D;
      font-weight: 700;
      font-size: 13px;
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-rollback-direct {
      background: transparent;
      color: var(--dim);
      border: 1px solid var(--line2);
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-close {
      background: none;
      border: none;
      color: var(--dim);
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">🛡️</div>
      <span>DevSquad Studio</span>
      <span class="tag-pill">Autonomous Team</span>
      <span class="repo-pill" id="repoPill">📁 devsquad</span>
    </div>
    <div class="header-actions">
      <span style="font-size: 12px; color: var(--dim); font-family: var(--f-mono);">
        <span class="status-dot"></span> <span id="modelTag">Ollama (qwen2.5-coder:7b)</span>
      </span>
      <button class="btn-review-desk" onclick="openReviewDesk()">
        📋 The Review Desk <span id="stagedBadge" style="background:rgba(0,0,0,0.25);padding:1px 6px;border-radius:999px;font-size:11px;">1</span>
      </button>
    </div>
  </header>

  <!-- Studio Viewport Grid -->
  <div class="viewport-container">
    
    <!-- Left: Authentic Pixel Office Viewport -->
    <div class="canvas-wrap">
      <div class="canvas-frame">
        <canvas id="officeCanvas" width="480" height="270"></canvas>
      </div>

      <!-- Bottom Dispatcher -->
      <div class="bottom-command-bar">
        <div class="input-wrapper">
          <input type="text" id="goalInput" class="prompt-input" placeholder="Dispatch a feature to your squad (e.g., 'Add JWT refresh rotation with tests')..." />
          <button class="btn-run-relay" onclick="dispatchGoal()">▶ Run Relay</button>
        </div>
        <div class="quick-chips-row">
          <button class="quick-chip" onclick="quickFill('Add healthcheck endpoint with tests')">⚡ Healthcheck</button>
          <button class="quick-chip" onclick="quickFill('Add rate limiting middleware')">🛡️ Rate Limiter</button>
          <button class="quick-chip" onclick="quickFill('Refactor DB connection pool')">📦 DB Pool</button>
        </div>
      </div>
    </div>

    <!-- Right: Real-time Relay Feed -->
    <div class="feed-panel">
      <div class="feed-header">
        <h3>⚡ Real-Time Relay Feed</h3>
        <span style="font-size: 11px; color: var(--accent); font-family: var(--f-mono);">Live SSE</span>
      </div>
      <div class="feed-list" id="feedList">
        <div class="feed-item">
          <span class="feed-agent-tag tag-system">[System]</span><br>
          DevSquad initialized. Apex, Alpha, Gamma, and Delta are standing by at their desks.
        </div>
      </div>
    </div>

  </div>

  <!-- Review Desk Modal -->
  <div class="modal-backdrop" id="reviewModal">
    <div class="review-modal">
      <div class="modal-head">
        <h2>📋 The Review Desk (Staged Task)</h2>
        <button class="btn-close" onclick="closeReviewDesk()">✕</button>
      </div>
      <div class="modal-body" id="modalContent">
        <div style="color:var(--dim); font-size:13px; text-align:center; padding: 30px;">
          Loading staged task details...
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-rollback-direct" onclick="rollbackTask()">↺ Rollback Backup</button>
        <button class="btn-apply-direct" onclick="applyTask()">✓ Apply Changes to Codebase</button>
      </div>
    </div>
  </div>

  <!-- Pixel Canvas Engine (DevCity-Style Pixel Art Architecture) -->
  <script>
    const canvas = document.getElementById("officeCanvas");
    const g = canvas.getContext("2d");
    const W = 480, H = 270;
    let tick = 0;
    let currentTaskId = null;

    // Helper draw functions
    function R(ctx, color, x, y, w, h) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    }
    function shade(hex, factor) {
      if (!hex || hex.startsWith("rgba")) return hex;
      let c = parseInt(hex.slice(1), 16);
      let r = Math.min(255, Math.floor(((c >> 16) & 255) * factor));
      let g = Math.min(255, Math.floor(((c >> 8) & 255) * factor));
      let b = Math.min(255, Math.floor((c & 255) * factor));
      return `rgb(${r},${g},${b})`;
    }

    // 4 Specialized DevSquad Personas
    const AGENTS = {
      apex: {
        id: "apex", name: "Apex (Architect)",
        x: 100, y: 110, deskX: 100, deskY: 100,
        skin: "#FFD0A8", hair: "#2C2018", shirt: "#818CF8", pants: "#1E1B4B",
        style: "neat", glasses: true,
        task: "idle", bubble: "Architecture ready."
      },
      alpha: {
        id: "alpha", name: "Alpha (Engineer)",
        x: 210, y: 110, deskX: 210, deskY: 100,
        skin: "#E0AC69", hair: "#1A1A1A", shirt: "#38BDF8", pants: "#0F172A",
        style: "curly", headphones: true,
        task: "idle", bubble: "Writing clean code."
      },
      gamma: {
        id: "gamma", name: "Gamma (QA Specialist)",
        x: 320, y: 110, deskX: 320, deskY: 100,
        skin: "#F5D0A9", hair: "#9A3412", shirt: "#34D399", pants: "#064E3B",
        style: "long", glasses: true,
        task: "idle", bubble: "Tests running."
      },
      delta: {
        id: "delta", name: "Delta (DevOps)",
        x: 410, y: 110, deskX: 410, deskY: 100,
        skin: "#C68642", hair: "#1C1917", shirt: "#FBBF24", pants: "#3F2C10",
        style: "cap", accent: "#F97316",
        task: "idle", bubble: "Branches synced."
      }
    };

    // Draw Room Background (Isometric Parquet Tiles, Walls, Windows)
    function drawRoom() {
      // Upper Wall
      R(g, "#1E293B", 0, 0, W, 50);
      R(g, "#0F172A", 0, 48, W, 2);

      // Windows with city glow
      [50, 180, 310].forEach(wx => {
        R(g, "#0A1124", wx, 8, 70, 32);
        R(g, "#38BDF8", wx + 2, 10, 66, 28);
        R(g, "#0A1124", wx + 33, 10, 4, 28);
        R(g, "#0A1124", wx + 2, 22, 66, 4);
      });

      // Whiteboard in meeting area
      R(g, "#F8FAFC", 140, 10, 80, 30);
      R(g, "#64748B", 138, 8, 84, 2);
      R(g, "#64748B", 138, 38, 84, 2);
      // Sketch on whiteboard
      R(g, "#38BDF8", 148, 16, 20, 8);
      R(g, "#818CF8", 175, 16, 16, 8);
      R(g, "#34D399", 196, 20, 14, 12);
      R(g, "#94A3B8", 168, 20, 7, 2);

      // Parquet Wooden Floor Tiles
      for (let y = 50; y < H; y += 16) {
        for (let x = 0; x < W; x += 32) {
          const alt = ((x / 32) + (y / 16)) % 2 === 0;
          R(g, alt ? "#0F172A" : "#131C35", x, y, 32, 16);
          R(g, "rgba(255,255,255,0.02)", x, y, 32, 1);
          R(g, "rgba(0,0,0,0.25)", x, y + 15, 32, 1);
        }
      }

      // Large Rug under workstations
      R(g, "#1E294A", 40, 85, 400, 140);
      R(g, "#2C3C68", 42, 87, 396, 136);

      // Plants in corners
      drawPlant(16, 60);
      drawPlant(450, 60);
      drawPlant(16, 220);
      drawPlant(450, 220);

      // Water cooler & coffee machine
      drawWaterCooler(16, 140);
    }

    function drawPlant(x, y) {
      R(g, "#78350F", x, y + 10, 14, 12);
      R(g, "#92400E", x - 1, y + 8, 16, 3);
      R(g, "#166534", x - 2, y, 18, 10);
      R(g, "#22C55E", x + 1, y - 4, 12, 8);
    }

    function drawWaterCooler(x, y) {
      R(g, "#E2E8F0", x, y + 8, 14, 20);
      R(g, "#38BDF8", x + 2, y - 6, 10, 14);
      R(g, "#0284C7", x + 4, y - 4, 6, 10);
    }

    // Draw Desks, CRT Monitors & Chairs
    function drawWorkstations() {
      Object.values(AGENTS).forEach(a => {
        const dx = a.deskX, dy = a.deskY;

        // Shadow
        R(g, "rgba(0,0,0,0.4)", dx - 36, dy + 22, 72, 8);

        // Desk Wooden Body
        R(g, "#334155", dx - 35, dy - 4, 70, 24);
        R(g, "#1E293B", dx - 35, dy + 20, 6, 14);
        R(g, "#1E293B", dx + 29, dy + 20, 6, 14);

        // Desk Mat
        R(g, "#0F172A", dx - 20, dy - 2, 40, 18);

        // Monitor & Stand
        R(g, "#64748B", dx - 3, dy - 8, 6, 6);
        R(g, "#0B1120", dx - 18, dy - 28, 36, 20);
        R(g, "#1E293B", dx - 16, dy - 26, 32, 16);

        // Animated Screen Code Typing
        const step = Math.floor(tick / 10);
        const codeColor = a.task === "busy" ? "#38BDF8" : a.shirt;
        for (let i = 0; i < 4; i++) {
          const w = 6 + ((i * 7 + step) % 18);
          R(g, codeColor, dx - 14, dy - 24 + i * 3.5, w, 2);
        }

        // Keyboard & Mouse
        R(g, "#475569", dx - 12, dy + 4, 16, 6);
        R(g, "#94A3B8", dx + 8, dy + 6, 4, 4);

        // Coffee Mug
        R(g, "#F8FAFC", dx + 22, dy + 2, 5, 6);
        R(g, a.shirt, dx + 23, dy + 3, 3, 2);
      });
    }

    // Draw Pixel Person
    function drawAvatar(a) {
      const x = Math.round(a.x);
      const y = Math.round(a.y);
      const blink = (tick % 180) < 6;

      // Chair back
      R(g, "#0F172A", x - 10, y - 4, 20, 16);
      R(g, "#334155", x - 8, y - 2, 16, 2);

      // Torso & Shirt
      R(g, a.shirt, x - 8, y - 8, 16, 14);
      R(g, shade(a.shirt, 0.8), x - 8, y + 4, 16, 2);

      // Head
      R(g, a.skin, x - 5, y - 18, 10, 10);

      // Eyes
      if (!blink) {
        R(g, "#0F172A", x - 3, y - 14, 2, 2);
        R(g, "#0F172A", x + 1, y - 14, 2, 2);
      } else {
        R(g, "#0F172A", x - 3, y - 13, 2, 1);
        R(g, "#0F172A", x + 1, y - 13, 2, 1);
      }

      // Hair / Cap / Accessories
      if (a.style === "cap") {
        R(g, a.accent, x - 6, y - 22, 12, 5);
        R(g, a.accent, x - 8, y - 18, 16, 2);
      } else if (a.style === "long") {
        R(g, a.hair, x - 6, y - 21, 12, 4);
        R(g, a.hair, x - 7, y - 17, 3, 14);
        R(g, a.hair, x + 4, y - 17, 3, 14);
      } else {
        R(g, a.hair, x - 6, y - 21, 12, 4);
        R(g, a.hair, x - 6, y - 17, 2, 4);
      }

      // Glasses
      if (a.glasses) {
        R(g, "#000", x - 4, y - 15, 3, 3);
        R(g, "#000", x + 1, y - 15, 3, 3);
        R(g, "#38BDF8", x - 3, y - 14, 1, 1);
        R(g, "#38BDF8", x + 2, y - 14, 1, 1);
      }

      // Speech bubble
      if (a.bubble) {
        g.font = "8px 'Press Start 2P', monospace";
        const txt = a.bubble.length > 20 ? a.bubble.substring(0, 19) + "…" : a.bubble;
        const tw = g.measureText(txt).width;
        const bw = Math.max(70, tw + 14);
        const bx = Math.round(x - bw / 2);
        const by = y - 36;

        R(g, "rgba(15, 23, 42, 0.95)", bx, by, bw, 15);
        R(g, a.shirt, bx, by, bw, 1);
        R(g, a.shirt, bx, by + 14, bw, 1);
        R(g, a.shirt, bx, by, 1, 15);
        R(g, a.shirt, bx + bw - 1, by, 1, 15);

        // Pointer triangle
        R(g, a.shirt, x - 2, by + 15, 4, 2);

        g.fillStyle = "#F8FAFC";
        g.fillText(txt, bx + 7, by + 11);
      }
    }

    // Main Canvas Render Loop
    function render() {
      tick++;
      drawRoom();
      drawWorkstations();
      Object.values(AGENTS).forEach(drawAvatar);
      requestAnimationFrame(render);
    }
    render();

    // API & UI Interaction
    async function loadStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        document.getElementById("repoPill").textContent = `📁 ${data.repo_name} (${data.languages.join(", ") || "generic"})`;
        document.getElementById("modelTag").textContent = `${data.provider} (${data.model})`;
      } catch (e) {}
    }

    async function loadTasks() {
      try {
        const res = await fetch("/api/tasks");
        const tasks = await res.json();
        document.getElementById("stagedBadge").textContent = tasks.length;
        if (tasks.length > 0) {
          currentTaskId = tasks[0].task_id;
        }
      } catch (e) {}
    }

    async function openReviewDesk() {
      const modal = document.getElementById("reviewModal");
      const content = document.getElementById("modalContent");
      modal.style.display = "flex";

      if (!currentTaskId) {
        content.innerHTML = `<div style="text-align:center;padding:40px;color:var(--dim);">No staged tasks yet. Dispatch an engineering feature from the command bar!</div>`;
        return;
      }

      try {
        const res = await fetch(`/api/task?id=${currentTaskId}`);
        const task = await res.json();

        const diffsHtml = task.diffs.map(d => `
          <div style="font-weight:700;font-size:12px;margin-top:10px;">📄 ${d.file_path} <span style="color:var(--ok);font-size:11px;">+${d.additions}</span> <span style="color:var(--bad);font-size:11px;">-${d.deletions}</span></div>
          <div class="diff-block">${formatDiffLines(d.patch_text || 'New file created')}</div>
        `).join("");

        const testHtml = task.test_result ? `
          <div style="font-weight:700;font-size:12px;margin-top:10px;">🧪 Test Runner Output (${task.test_result.passed ? '<span style="color:var(--ok);">PASSED ✅</span>' : '<span style="color:var(--bad);">FAILED ❌</span>'} in ${task.test_result.duration_s}s)</div>
          <div class="diff-block">${escapeHtml(task.test_result.output || 'All tests passed cleanly.')}</div>
        ` : '';

        content.innerHTML = `
          <div style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;">
            <div style="font-size:14px;font-weight:700;">${escapeHtml(task.goal)}</div>
            <div style="font-size:11.5px;color:var(--dim);margin-top:4px;font-family:var(--f-mono);">
              Branch: <b>${task.git_branch || 'staged'}</b> · Status: <b style="color:var(--accent);">${task.status}</b>
            </div>
          </div>
          ${testHtml}
          ${diffsHtml}
        `;
      } catch (e) {
        content.innerHTML = `<div style="color:var(--bad);">Error loading task details.</div>`;
      }
    }

    function closeReviewDesk() {
      document.getElementById("reviewModal").style.display = "none";
    }

    async function applyTask() {
      if (!currentTaskId) return;
      if (!confirm("Apply these verified staged changes directly to your repository?")) return;
      const res = await fetch(`/api/apply?id=${currentTaskId}`, { method: "POST" });
      const data = await res.json();
      if (data.success) {
        alert("Changes applied successfully to your codebase!");
        closeReviewDesk();
        loadTasks();
      } else {
        alert("Error applying changes: " + data.error);
      }
    }

    async function rollbackTask() {
      if (!currentTaskId) return;
      if (!confirm("Rollback changes from backup?")) return;
      const res = await fetch(`/api/rollback?id=${currentTaskId}`, { method: "POST" });
      const data = await res.json();
      if (data.success) {
        alert("Rollback successful.");
        closeReviewDesk();
        loadTasks();
      } else {
        alert("Error: " + data.error);
      }
    }

    async function dispatchGoal() {
      const input = document.getElementById("goalInput");
      const goal = input.value.trim();
      if (!goal) return;
      input.value = "";

      AGENTS.apex.bubble = "Planning spec...";
      AGENTS.alpha.bubble = "Waiting for spec...";
      AGENTS.gamma.bubble = "Test bench ready.";
      AGENTS.delta.bubble = "Tracking branch...";

      addFeed("System", `Goal dispatched: "${goal}"`);

      await fetch("/api/dispatch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ goal })
      });
    }

    function quickFill(val) {
      document.getElementById("goalInput").value = val;
    }

    function addFeed(agent, text) {
      const list = document.getElementById("feedList");
      const item = document.createElement("div");
      item.className = "feed-item";
      const tagClass = `tag-${agent.toLowerCase()}`;
      item.innerHTML = `<span class="feed-agent-tag ${tagClass}">[${agent}]</span><br>${escapeHtml(text)}`;
      list.appendChild(item);
      list.scrollTop = list.scrollHeight;
    }

    function formatDiffLines(patch) {
      return patch.split("\n").map(l => {
        if (l.startsWith("+") && !l.startsWith("+++")) return `<span class="diff-add">${escapeHtml(l)}</span>`;
        if (l.startsWith("-") && !l.startsWith("---")) return `<span class="diff-del">${escapeHtml(l)}</span>`;
        return escapeHtml(l);
      }).join("\n");
    }

    function escapeHtml(text) {
      return (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Connect SSE Event Stream
    function connectSSE() {
      const sse = new EventSource("/api/events");
      sse.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          const ag = msg.agent.toLowerCase();
          if (AGENTS[ag]) {
            AGENTS[ag].bubble = msg.data.message || msg.event;
          }
          addFeed(msg.agent, msg.data.message || msg.event);
          if (msg.event === "STAGED" || msg.event === "VERIFIED_GREEN") {
            loadTasks();
          }
        } catch (err) {}
      };
      sse.onerror = () => setTimeout(connectSSE, 3000);
    }

    loadStatus();
    loadTasks();
    connectSSE();
  </script>
</body>
</html>
