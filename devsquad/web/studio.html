<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevSquad · Autonomous AI Engineering Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F172A'/%3E%3Cpath fill='%2338BDF8' d='M8 24V8l8 5-8 5zM16 24V8l8 5-8 5z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0F19;
      --card: #151D30;
      --card-hover: #1E293B;
      --border: #24304A;
      --ink: #F1F5F9;
      --dim: #94A3B8;
      --accent: #38BDF8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --green: #34D399;
      --green-bg: rgba(52, 211, 153, 0.15);
      --red: #F87171;
      --red-bg: rgba(248, 113, 113, 0.15);
      --amber: #FBBF24;
      --font-mono: 'JetBrains Mono', monospace;
      --font-pixel: 'Press Start 2P', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header {
      height: 56px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
    }
    .brand span.tag {
      background: var(--accent-glow);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--dim);
    }
    .dot-live {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
      display: inline-block;
    }

    /* Main Workspace Layout */
    .studio-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 420px;
      overflow: hidden;
    }

    /* Left: Virtual Office & Command Center */
    .office-pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      position: relative;
    }
    .canvas-container {
      flex: 1;
      position: relative;
      background: #0D1322;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Command Dispatcher Bar */
    .command-bar {
      padding: 16px 20px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }
    .command-bar input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--ink);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .command-bar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .btn-dispatch {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      font-size: 13px;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: filter 0.2s;
    }
    .btn-dispatch:hover {
      filter: brightness(1.1);
    }

    /* Right: Review Desk & Staging Deck */
    .review-pane {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .review-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .review-header h2 {
      font-size: 15px;
      font-weight: 600;
    }
    .task-card {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .task-card:hover, .task-card.active {
      background: var(--card);
    }
    .task-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .task-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge.green { background: var(--green-bg); color: var(--green); }
    .badge.red { background: var(--red-bg); color: var(--red); }
    .badge.amber { background: rgba(251, 191, 36, 0.15); color: var(--amber); }

    .diff-preview {
      background: #080C14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-top: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .diff-add { color: var(--green); }
    .diff-del { color: var(--red); }

    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .btn-apply {
      flex: 1;
      background: var(--green);
      color: #000;
      font-weight: 600;
      font-size: 12px;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-rollback {
      background: transparent;
      color: var(--dim);
      border: 1px solid var(--border);
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Live Activity Feed */
    .logs-box {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--dim);
      background: #080C14;
      padding: 10px;
      border-radius: 6px;
      max-height: 120px;
      overflow-y: auto;
      margin-top: 10px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="brand">
      <span style="font-size: 20px;">🛡️</span> DevSquad <span class="tag">Studio v0.1</span>
      <span id="repo-title" style="color: var(--dim); font-weight: 500; font-size: 13px;"></span>
    </div>
    <div class="status-badge">
      <span id="provider-badge">Ollama (qwen2.5-coder:7b)</span>
      <span><span class="dot-live"></span> Studio Online</span>
    </div>
  </header>

  <!-- Main Grid -->
  <div class="studio-grid">
    
    <!-- Office View -->
    <div class="office-pane">
      <div class="canvas-container">
        <canvas id="officeCanvas" width="760" height="460"></canvas>
      </div>

      <!-- Command Bar -->
      <div class="command-bar">
        <input type="text" id="goalInput" placeholder="Dispatch a feature to DevSquad (e.g., 'Add JWT refresh rotation with tests')..." />
        <button class="btn-dispatch" onclick="dispatchTask()">▶ Run Relay</button>
      </div>
    </div>

    <!-- Review Desk / Staging Deck -->
    <div class="review-pane">
      <div class="review-header">
        <h2>📋 The Review Desk (Staging)</h2>
        <button class="btn-rollback" onclick="refreshTasks()" style="padding: 4px 8px; font-size: 11px;">↻ Refresh</button>
      </div>
      <div id="tasksList" style="padding: 12px 0;">
        <div style="padding: 20px; text-align: center; color: var(--dim); font-size: 13px;">
          No staged tasks yet. Dispatch an engineering goal to watch Apex, Alpha, Gamma, and Delta work!
        </div>
      </div>
    </div>

  </div>

  <script>
    // Canvas & Agent state
    const canvas = document.getElementById("officeCanvas");
    const ctx = canvas.getContext("2d");

    const agents = {
      apex: { name: "Apex (Architect)", x: 140, y: 150, color: "#818CF8", task: "Idle", bubble: "Ready to plan architecture." },
      alpha: { name: "Alpha (Engineer)", x: 320, y: 150, color: "#38BDF8", task: "Idle", bubble: "Code editor open." },
      gamma: { name: "Gamma (QA Specialist)", x: 480, y: 150, color: "#34D399", task: "Idle", bubble: "Test runner standing by." },
      delta: { name: "Delta (DevOps)", x: 620, y: 150, color: "#FBBF24", task: "Idle", bubble: "Git branches synced." }
    };

    function drawOffice() {
      // Room Floor & Wall
      ctx.fillStyle = "#111827";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Floor grid
      ctx.strokeStyle = "#1F2937";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Draw Desks and Agents
      Object.entries(agents).forEach(([key, ag]) => {
        // Desk
        ctx.fillStyle = "#1E293B";
        ctx.fillRect(ag.x - 45, ag.y + 10, 90, 45);
        ctx.strokeStyle = "#334155";
        ctx.strokeRect(ag.x - 45, ag.y + 10, 90, 45);

        // Monitor
        ctx.fillStyle = "#0F172A";
        ctx.fillRect(ag.x - 20, ag.y + 18, 40, 20);
        ctx.fillStyle = ag.color;
        ctx.fillRect(ag.x - 18, ag.y + 20, 36, 16);

        // Avatar
        ctx.fillStyle = ag.color;
        ctx.beginPath();
        ctx.arc(ag.x, ag.y, 16, 0, Math.PI * 2);
        ctx.fill();

        // Label
        ctx.fillStyle = "#F1F5F9";
        ctx.font = "bold 11px Inter, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(ag.name, ag.x, ag.y + 75);

        // Speech Bubble
        if (ag.bubble) {
          ctx.fillStyle = "#0F172A";
          ctx.strokeStyle = ag.color;
          ctx.lineWidth = 1;
          const bubbleW = 160;
          ctx.fillRect(ag.x - bubbleW/2, ag.y - 45, bubbleW, 26);
          ctx.strokeRect(ag.x - bubbleW/2, ag.y - 45, bubbleW, 26);

          ctx.fillStyle = "#E2E8F0";
          ctx.font = "10px Inter, sans-serif";
          ctx.fillText(ag.bubble.substring(0, 26), ag.x, ag.y - 28);
        }
      });

      requestAnimationFrame(drawOffice);
    }
    drawOffice();

    // API & Event logic
    async function loadStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        document.getElementById("repo-title").textContent = `📁 ${data.repo_name} (${data.languages.join(", ") || "generic"})`;
        document.getElementById("provider-badge").textContent = `${data.provider} (${data.model})`;
      } catch (e) {}
    }

    async function refreshTasks() {
      try {
        const res = await fetch("/api/tasks");
        const tasks = await res.json();
        const container = document.getElementById("tasksList");
        if (tasks.length === 0) {
          container.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--dim); font-size: 13px;">No staged tasks yet. Dispatch an engineering goal above!</div>`;
          return;
        }

        container.innerHTML = tasks.map(t => `
          <div class="task-card" onclick="loadTaskDetails('${t.task_id}')">
            <div class="task-card-header">
              <span class="task-title">${t.goal}</span>
              <span class="badge ${t.tests_passed ? 'green' : (t.status === 'staged' ? 'amber' : 'red')}">${t.status}</span>
            </div>
            <div style="font-size: 11px; color: var(--dim);">
              🌿 Branch: <code>${t.git_branch || 'staged'}</code> · ${t.diff_count} diffs
            </div>
            <div id="details-${t.task_id}" style="display:none;"></div>
          </div>
        `).join("");
      } catch (e) {}
    }

    async function loadTaskDetails(tid) {
      const target = document.getElementById(`details-${tid}`);
      if (!target) return;
      if (target.style.display === "block") {
        target.style.display = "none";
        return;
      }

      try {
        const res = await fetch(`/api/task?id=${tid}`);
        const task = await res.json();
        target.style.display = "block";

        const diffsHtml = task.diffs.map(d => `
          <div style="margin-top: 8px; font-weight: 600; font-size: 11px;">📄 ${d.file_path} (+${d.additions} -${d.deletions})</div>
          <div class="diff-preview">${escapeHtml(d.patch_text || 'New file created')}</div>
        `).join("");

        const testHtml = task.test_result ? `
          <div style="margin-top: 8px; font-weight: 600; font-size: 11px;">🧪 Test Output (${task.test_result.passed ? 'PASSED ✅' : 'FAILED ❌'} in ${task.test_result.duration_s}s)</div>
          <div class="diff-preview">${escapeHtml(task.test_result.output || 'Passed with zero errors')}</div>
        ` : '';

        const logsHtml = `
          <div class="logs-box">${task.relay_logs.join("<br>")}</div>
        `;

        target.innerHTML = `
          ${testHtml}
          ${diffsHtml}
          ${logsHtml}
          <div class="action-row">
            <button class="btn-apply" onclick="applyTask('${tid}')">✓ Apply Changes to Repo</button>
            <button class="btn-rollback" onclick="rollbackTask('${tid}')">Rollback</button>
          </div>
        `;
      } catch (e) {}
    }

    async function applyTask(tid) {
      if (!confirm("Apply these verified staged changes directly to your repository?")) return;
      const res = await fetch(`/api/apply?id=${tid}`, { method: "POST" });
      const data = await res.json();
      if (data.success) {
        alert("Changes applied successfully to your codebase!");
        refreshTasks();
      } else {
        alert("Error applying changes: " + data.error);
      }
    }

    async function rollbackTask(tid) {
      if (!confirm("Rollback changes from backup?")) return;
      const res = await fetch(`/api/rollback?id=${tid}`, { method: "POST" });
      const data = await res.json();
      if (data.success) {
        alert("Rollback successful.");
        refreshTasks();
      } else {
        alert("Error: " + data.error);
      }
    }

    async function dispatchTask() {
      const input = document.getElementById("goalInput");
      const goal = input.value.trim();
      if (!goal) return;
      input.value = "";

      agents.apex.bubble = "Analyzing request...";
      agents.alpha.bubble = "Waiting for spec...";
      agents.gamma.bubble = "Preparing test bench...";
      agents.delta.bubble = "Tracking branch...";

      await fetch("/api/dispatch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ goal })
      });
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Connect SSE for real-time office updates
    function connectSSE() {
      const src = new EventSource("/api/events");
      src.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          const agKey = msg.agent.toLowerCase();
          if (agents[agKey]) {
            agents[agKey].bubble = msg.data.message || msg.event;
          }
          if (msg.event === "STAGED" || msg.event === "VERIFIED_GREEN") {
            refreshTasks();
          }
        } catch (err) {}
      };
      src.onerror = () => setTimeout(connectSSE, 3000);
    }

    loadStatus();
    refreshTasks();
    connectSSE();
  </script>
</body>
</html>
